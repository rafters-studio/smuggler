name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      # smugglr-wasm is #![cfg(target_arch = "wasm32")], so the host clippy run
      # above compiles it to nothing -- its lints never gate. Run clippy against
      # the wasm32 target explicitly so wasm-only lints are caught (#155).
      - name: Clippy (wasm32)
        run: cargo clippy -p smugglr-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh scripts/publish-crate.sh docs/examples/westwind/make.sh docs/examples/westwind/scaffold.sh

  examples:
    name: Examples match their READMEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the CLI
        run: cargo build --release -p smugglr
      # Every `$ smugglr ...` block in the credential-free CLI example READMEs
      # is re-run against the built binary and compared (sorted lines; JSON
      # parsed). A change to the CLI's output fails here instead of dating the
      # docs silently. See scripts/check-examples.py.
      - name: Run the examples
        run: python3 scripts/check-examples.py --smugglr "$PWD/target/release/smugglr"
      # The root README copies its blocks from docs/examples; a block with no
      # source there was typed, and typed output is what #426 removed.
      - name: README blocks come from the examples
        run: python3 scripts/check-examples.py --readme

  versions:
    name: Crate versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Inter-crate deps resolve by path locally, so a stale version req is
      # invisible to every other job here and only surfaces in the published
      # artifact, where it is immutable. This is the one check that reads
      # what `cargo publish` would actually ship.
      - run: python3 scripts/check-crate-versions.py

  forger-boundary:
    name: Forger boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # forger is an oracle only while it knows nothing about smugglr. Every
      # other job here passes just as green with `smugglr-core` in forger's
      # dependencies -- the code would compile, the tests would run, and the
      # crate would quietly stop being extractable. This is the one check that
      # reads the boundary itself.
      - run: python3 scripts/check-forger-boundary.py

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  e2e-smugglr-npm:
    name: E2E (smugglr npm + OPFS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # #437's Node test (test/node-init.test.mjs) calls node:sqlite's
          # StatementSync.setReturnArrays(), added in Node 24.0.0 -- the same
          # floor docs/examples/node-server-to-d1's local-endpoint.mjs
          # already assumes. Keep this in step with packages/smugglr/README.md's
          # Node paragraph.
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/smugglr/pnpm-lock.yaml
      - name: Run smugglr-wasm unit tests (wasm32, node)
        # The crate is #![cfg(target_arch = "wasm32")], so host `cargo test`
        # runs none of its tests; they execute only via wasm-pack (#155).
        run: wasm-pack test --node crates/smugglr-wasm
      - name: Install deps
        working-directory: packages/smugglr
        run: pnpm install --frozen-lockfile
      - name: Build smugglr
        working-directory: packages/smugglr
        run: pnpm build
      - name: Run Node init test (#437)
        working-directory: packages/smugglr
        run: pnpm test:node
      - name: Install Playwright browsers
        working-directory: packages/smugglr
        run: pnpm test:e2e:install
      - name: Run e2e
        working-directory: packages/smugglr
        run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/smugglr/playwright-report
          retention-days: 7

  plugin-layout:
    name: Installed layout resolves the plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build both binaries
        run: cargo build --release -p smugglr -p smugglr-http-sql
      # The release archive and the installer place smugglr and
      # smugglr-http-sql side by side (#430). Stage that layout and prove a
      # plugin target resolves the plugin from PATH rather than failing with
      # "not found". The endpoint is unreachable on purpose; the connection
      # failing is fine, the plugin failing to resolve is not.
      - name: Resolve the plugin from an installed layout
        run: |
          mkdir -p "$HOME/.local/bin"
          cp target/release/smugglr target/release/smugglr-http-sql "$HOME/.local/bin/"
          export PATH="$HOME/.local/bin:$PATH"
          sqlite3 local.db "CREATE TABLE t (id TEXT PRIMARY KEY NOT NULL, updated_at INTEGER NOT NULL);"
          cat > layout.toml <<'TOML'
          local_db = "./local.db"

          [target]
          type = "plugin"
          name = "http-sql"

          [target.config]
          profile = "generic"
          url = "http://127.0.0.1:9/sql"
          TOML
          out="$(smugglr -c layout.toml status 2>&1 || true)"
          echo "$out"
          case "$out" in
            *"not found"*) echo "plugin did not resolve from PATH"; exit 1 ;;
          esac
          echo "$out" | grep -q "Target Plugin (http-sql)" || { echo "plugin target not reported"; exit 1; }

